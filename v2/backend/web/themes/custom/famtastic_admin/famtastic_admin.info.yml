name: 'FAMtastic Admin'
type: theme
description: 'Premium dark admin theme for the FAMtastic Designs headless CMS. A Claro sub-theme that re-skins the toolbar, admin menus, forms, tables, tabs and messages with a lime-on-near-black brand treatment.'
package: FAMtastic
core_version_requirement: ^11
base theme: claro

# Default logo placement (theme setting) used by the Site Branding block.
logo: logo.svg

# Brand stylesheet, auto-attached on every page rendered by this theme.
# Also attached defensively in famtastic_admin.theme (Drupal de-duplicates).
libraries:
  - famtastic_admin/global-styling

# Regions are NOT merged with the base theme when redeclared, so all Claro
# regions are repeated here and extended with a custom "logo" region that
# can hold the Site Branding block independently from the header.
regions:
  header: 'Header'
  pre_content: 'Pre-content'
  breadcrumb: 'Breadcrumb'
  highlighted: 'Highlighted'
  help: 'Help'
  content: 'Content'
  page_top: 'Page top'
  page_bottom: 'Page bottom'
  sidebar_first: 'First sidebar'
  logo: 'Logo'

# Parity with Claro, which hides its optional first sidebar.
regions_hidden:
  - sidebar_first
