# FAMtastic Designs v2 — nginx config for the Drupal 11 backend container.
#
# Full nginx.conf (not a vhost include): the container runs nginx as its main
# process, as the non-root www-data user, so pid/log/temp paths live in
# stdout/stderr and /tmp. PHP-FPM is reached over a unix socket.

user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 32m;

    # Non-root runtime: all temp paths must be writable by www-data.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/vnd.api+json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html/web;
        index index.php;

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            allow all;
            log_not_found off;
            access_log off;
        }

        # Hidden/dot files (.htaccess, .git, ...) are never served.
        # (well-known is exempted for ACME-style challenges.)
        location ~ (^|/)\.(?!well-known) {
            return 403;
        }

        # Never execute PHP from the public files directory.
        location ~* ^/sites/default/files/.*\.php$ {
            return 403;
        }

        # Public files — including image-style derivatives and aggregated
        # css/js — are served directly. A missing derivative falls through
        # to Drupal (/index.php), which generates it on first request.
        location ~* ^/sites/default/files/ {
            try_files $uri /index.php?$query_string;
            access_log off;
            expires 7d;
        }

        # Clean URLs: everything else is a Drupal route.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP front controller (index.php, update.php, authorize.php...).
        location ~ '\.php$|^/update.php' {
            fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
            # Refuse requests for PHP files that do not exist.
            try_files $uri =404;
            fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_PROXY '';
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_read_timeout 300s;
        }

        # Deny direct access to code/config artifacts inside the docroot
        # (composer manifests, twig templates, yml, sql dumps, ...).
        location ~* \.(engine|inc|install|make|module|profile|po|sh|sql|theme|twig|xtmpl|yml|yaml)$ {
            return 403;
        }
        location ~* (^|/)(composer\.(json|lock)|web\.config|LICENSE.*|README.*)$ {
            return 403;
        }
    }
}
