# FAMtastic Designs v2 — Phase 2 deployment scaffold (NOT yet tested).
#
#   docker compose up --build
#
#   backend  → http://localhost:8080  (nginx + PHP-FPM 8.3, Drupal 11)
#   frontend → http://localhost:5173  (nginx, Vite build; proxies /jsonapi + /oauth)
#   db       → MariaDB 10.11 (internal to the compose network)
#
# Drupal picks up the DB_* env vars via the bridge at the bottom of
# backend/web/sites/default/settings.php (DB_* wins over the local SQLite
# default). The zero-config local flow (php -S :8080 + SQLite + vite dev)
# is untouched. If a SQLite variant is ever wanted in containers, add a
# compose override (docker-compose.sqlite.yml) that drops the db service and
# unsets DB_HOST — a `profiles:` split was considered and deferred.

name: famtastic-v2

services:
  backend:
    build: ./backend
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: famtastic
      DB_USER: drupal
      DB_PASSWORD: drupal
    volumes:
      # Public files (uploads, image styles) and out-of-docroot private files.
      - files_public:/var/www/html/web/sites/default/files
      - files_private:/var/www/html/private
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # robots.txt is a static scaffold file — proves nginx + docroot without
      # depending on whether Drupal has been installed yet.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/robots.txt"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: famtastic
      MARIADB_USER: drupal
      MARIADB_PASSWORD: drupal
      MARIADB_ROOT_PASSWORD: change-me-in-production
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
  files_public:
  files_private:
