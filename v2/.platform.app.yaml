# FAMtastic Designs v2 — Platform.sh app config (Phase 2 deployment scaffold).
# NOT yet tested — files only, no project has been pushed.
#
# Single-app layout: the Drupal backend lives in backend/, so `source.root`
# points Platform.sh at it (composer.json, web/ docroot, private/, config/
# all resolve relative to backend/). Companion files:
#   .platform/services.yaml — MariaDB 10.11 (`db`)
#   .platform/routes.yaml   — {default} → backend:http
#
# The React SPA is deployed separately (static hosting/CDN) with
# VITE_DRUPAL_BASE_URL pointing at this app's origin.

name: backend

source:
  root: backend

type: php:8.3

build:
  flavor: composer

runtime:
  extensions:
    - gd
    - mbstring
    - opcache
    - pdo_mysql
    - zip

# db service (mariadb:10.11) from .platform/services.yaml; its endpoint is
# named "mysql". Credentials reach Drupal via PLATFORM_RELATIONSHIPS — see
# the bridge at the bottom of web/sites/default/settings.php.
relationships:
  database: "db:mysql"

web:
  document_root: "/web"
  passthru: "/index.php"
  locations:
    # Public files are served directly; a missing image-style derivative
    # falls through to Drupal (passthru) and is generated on first request.
    "/sites/default/files":
      root: "web/sites/default/files"
      passthru: "/index.php"
      scripts: false
      allow: true
      expires: 1w
      rules:
        # Never execute PHP from the files directory.
        '\.php$':
          allow: false

mounts:
  "/web/sites/default/files":
    source: local
    source_path: "files"
  "/private":
    source: local
    source_path: "private"
  # Config sync NOTE: backend/config/sync (../config/sync from the docroot)
  # ships read-only with the codebase and is NOT mounted — the deploy hook
  # below imports it with drush config:import.

disk: 2048

variables:
  php:
    memory_limit: "256M"

hooks:
  deploy: |
    set -e
    vendor/bin/drush -y updatedb
    vendor/bin/drush -y config:import
    vendor/bin/drush -y cache:rebuild

crons:
  drupal:
    spec: "*/20 * * * *"
    commands:
      start: "vendor/bin/drush cron --quiet"
