services:
  postiz:
    # Patched with gitroomhq/postiz-app#1761 (closed-unmerged upstream, blocked
    # only on a CLA/contributor-application gate, not on code quality) — fixes
    # the TikTok Direct Post audit rejection cause documented in issues #1362
    # and #1563: hardcoded PUBLIC_TO_EVERYONE privacy default, no creator_info
    # display, interaction toggles not off-by-default. Built locally via
    # tools/postiz-app-src (v2.22.1 + the PR's 3-file diff), see
    # docker images localhost/postiz-famtastic:tiktok-ux-fix.
    image: localhost/postiz-famtastic:tiktok-ux-fix
    ports: !override
      - "127.0.0.1:4007:5000"
    environment:
      MAIN_URL: "${POSTIZ_PUBLIC_URL:-http://127.0.0.1:4007}"
      FRONTEND_URL: "${POSTIZ_PUBLIC_URL:-http://127.0.0.1:4007}"
      NEXT_PUBLIC_BACKEND_URL: "${POSTIZ_PUBLIC_URL:-http://127.0.0.1:4007}/api"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      JWT_SECRET: "${POSTIZ_JWT_SECRET}"
      DATABASE_URL: "postgresql://postiz-user:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/postiz-db-local"
      DISABLE_REGISTRATION: "${POSTIZ_DISABLE_REGISTRATION:-false}"
      NOT_SECURED: "true"
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      INSTAGRAM_APP_ID: "${INSTAGRAM_APP_ID:-}"
      INSTAGRAM_APP_SECRET: "${INSTAGRAM_APP_SECRET:-}"
      THREADS_APP_ID: "${THREADS_APP_ID:-}"
      THREADS_APP_SECRET: "${THREADS_APP_SECRET:-}"
      TIKTOK_CLIENT_ID: "${TIKTOK_CLIENT_ID:-}"
      TIKTOK_CLIENT_SECRET: "${TIKTOK_CLIENT_SECRET:-}"
      YOUTUBE_CLIENT_ID: "${YOUTUBE_CLIENT_ID:-}"
      YOUTUBE_CLIENT_SECRET: "${YOUTUBE_CLIENT_SECRET:-}"
      LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID:-}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET:-}"
      PINTEREST_CLIENT_ID: "${PINTEREST_CLIENT_ID:-}"
      PINTEREST_CLIENT_SECRET: "${PINTEREST_CLIENT_SECRET:-}"
      X_API_KEY: "${X_API_KEY:-}"
      X_API_SECRET: "${X_API_SECRET:-}"
  postiz-postgres:
    environment:
      POSTGRES_PASSWORD: "${POSTIZ_DB_PASSWORD}"
