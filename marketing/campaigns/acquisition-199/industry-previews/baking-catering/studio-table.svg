    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#e5a34f" stop-opacity=".9"/><stop offset="1" stop-color="#ad5637" stop-opacity=".65"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
