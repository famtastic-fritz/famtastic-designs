<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper, #d8d1c2);
          color: var(--ink, #2a2126);
        }
        .stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .world {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .plate {
          position: absolute;
          left: -54px;
          top: -104px;
          width: 1188px;
          height: 2128px;
          object-fit: cover;
        }
        .band {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1380px;
          background: linear-gradient(
            to bottom,
            var(--paper, #d8d1c2) 0px,
            var(--paper, #d8d1c2) 1060px,
            rgba(216, 209, 194, 0) 1380px
          );
        }
        .eyebrow {
          position: absolute;
          left: 84px;
          top: 196px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--muted, #5a4f53);
          opacity: 0;
        }
        .rule {
          position: absolute;
          left: 84px;
          top: 254px;
          width: 200px;
          height: 12px;
          background: var(--accent, #7fb449);
          transform-origin: 0% 50%;
        }
        .hl {
          position: absolute;
          left: 84px;
          font-family: Oswald, sans-serif;
          font-weight: 700;
          font-size: 100px;
          line-height: 0.98;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          white-space: nowrap;
          opacity: 0;
        }
        #s3-l1 {
          top: 308px;
        }
        #s3-l2 {
          top: 418px;
        }
        #s3-l3 {
          top: 528px;
        }
        #s3-l4 {
          top: 638px;
        }
        .support {
          position: absolute;
          left: 84px;
          top: 800px;
          width: 912px;
          font-family: Inter, sans-serif;
          font-weight: 400;
          font-size: 40px;
          line-height: 1.34;
          letter-spacing: -0.01em;
          color: var(--ink-soft, #5c5057);
          opacity: 0;
        }
        /* The crawler readout: a third register. The machine's own voice,
           deliberately mono so it never competes with the human sentence. */
        .readout {
          position: absolute;
          left: 84px;
          top: 920px;
          width: 912px;
          border-left: 4px solid var(--rule, #b7ad9a);
          padding-left: 28px;
          opacity: 0;
        }
        .readout div {
          font-family: "JetBrains Mono", monospace;
          font-size: 27px;
          font-weight: 700;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          line-height: 1.62;
          color: var(--ink-soft, #5c5057);
          white-space: nowrap;
        }
        .readout .dim {
          font-weight: 400;
          color: var(--muted, #5a4f53);
        }
        .vignette {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(
            118% 76% at 50% 36%,
            rgba(51, 39, 46, 0) 38%,
            rgba(51, 39, 46, 0.09) 68%,
            rgba(51, 39, 46, 0.28) 100%
          );
        }
      </style>

      <div id="root" data-composition-id="mechanism" data-width="1080" data-height="1920">
        <div class="stage" data-layout-allow-overflow="true">
          <div class="world" id="s3-w3">
            <img class="plate" src="assets/plates/pd-b2.jpg" alt="" />
          </div>
        </div>
        <div class="band"></div>
        <div class="vignette"></div>

        <div class="eyebrow" id="s3-eb">The mechanism</div>
        <div class="rule" id="s3-rl"></div>
        <div class="hl" data-layout-allow-overlap="true" id="s3-l1">A profile is an</div>
        <div class="hl" data-layout-allow-overlap="true" id="s3-l2">address inside</div>
        <div class="hl" data-layout-allow-overlap="true" id="s3-l3">somebody else's</div>
        <div class="hl" data-layout-allow-overlap="true" id="s3-l4">building.</div>

        <div class="support" id="s3-sup">Their rules. Their ranking. Their reach.</div>

        <div class="readout" id="s3-ro">
          <div class="dim">What a search engine sees:</div>
          <div>A list of links. Almost nothing.</div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var F = 1 / 30;

          var world = document.getElementById("s3-w3");
          var cam = { scale: 1 };
          function applyCamera() {
            world.style.transform = "scale(" + cam.scale + ")";
          }
          applyCamera();
          tl.fromTo(
            cam,
            { scale: 1 },
            { scale: 1.06, duration: 6.35, ease: "none", onUpdate: applyCamera },
            0,
          );

          tl.fromTo("#s3-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.05);
          tl.fromTo("#s3-rl", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.14);

          /* sine-wave-loop: the accent rule breathes while the beat holds.
             Finite repeat count derived with floor so it never overshoots. */
          var cycle = 1.6;
          var breatheDur = 5.6;
          tl.to(
            "#s3-rl",
            {
              scaleX: 0.9,
              duration: cycle / 2,
              ease: "sine.inOut",
              yoyo: true,
              repeat: Math.max(0, Math.floor(breatheDur / cycle) - 1),
            },
            0.6,
          );

          function whip(sel, t, y, d) {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: d, ease: "power4.out" }, t);
          }
          /* Scene starts at 6.15; sentence 4 lands at 6.35 -> local 0.20. */
          var a = 0.3;
          whip("#s3-l1", a, 76, 0.19);
          var b = a + 0.19 - F;
          whip("#s3-l2", b, 52, 0.16);
          var c = b + 0.16 - F;
          whip("#s3-l3", c, 52, 0.16);
          var d = c + 0.16 - 2 * F;
          whip("#s3-l4", d, 70, 0.17);

          /* Sentence 5 ("The rules can change...") lands at 9.75 -> local 3.60. */
          tl.fromTo(
            "#s3-sup",
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
            3.65,
          );

          /* The readout is the indexing fact, held to the end of the beat. */
          tl.fromTo(
            "#s3-ro",
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" },
            4.9,
          );

          window.__timelines["mechanism"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
