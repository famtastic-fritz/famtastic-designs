<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper, #d8d1c2);
          color: var(--ink, #2a2126);
        }
        .stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .world {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .plate {
          position: absolute;
          left: -54px;
          top: -104px;
          width: 1188px;
          height: 2128px;
          object-fit: cover;
        }
        .band {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1300px;
          background: linear-gradient(
            to bottom,
            var(--paper, #d8d1c2) 0px,
            var(--paper, #d8d1c2) 970px,
            rgba(216, 209, 194, 0) 1300px
          );
        }
        .eyebrow {
          position: absolute;
          left: 84px;
          top: 196px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--muted, #5a4f53);
          opacity: 0;
        }
        .rule {
          position: absolute;
          left: 84px;
          top: 254px;
          width: 200px;
          height: 12px;
          background: var(--accent, #7fb449);
          transform-origin: 0% 50%;
        }
        .hl {
          position: absolute;
          left: 84px;
          font-family: Oswald, sans-serif;
          font-weight: 700;
          font-size: 94px;
          line-height: 0.98;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          white-space: nowrap;
          opacity: 0;
        }
        #s4-l1 {
          top: 316px;
        }
        #s4-l2 {
          top: 420px;
        }
        .support {
          position: absolute;
          left: 84px;
          top: 690px;
          width: 880px;
          font-family: Inter, sans-serif;
          font-weight: 400;
          font-size: 40px;
          line-height: 1.34;
          letter-spacing: -0.01em;
          color: var(--ink-soft, #5c5057);
          opacity: 0;
        }
        .support b {
          font-weight: 900;
          color: var(--ink, #2a2126);
        }
        .vignette {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(
            118% 76% at 50% 36%,
            rgba(51, 39, 46, 0) 38%,
            rgba(51, 39, 46, 0.09) 68%,
            rgba(51, 39, 46, 0.28) 100%
          );
        }
      </style>

      <div id="root" data-composition-id="turn" data-width="1080" data-height="1920">
        <div class="stage" data-layout-allow-overflow="true">
          <div class="world" id="s4-w4">
            <img class="plate" src="assets/plates/pd-p.jpg" alt="" />
          </div>
        </div>
        <div class="band"></div>
        <div class="vignette"></div>

        <div class="eyebrow" id="s4-eb">The fix</div>
        <div class="rule" id="s4-rl"></div>
        <div class="hl" data-layout-allow-overlap="true" id="s4-l1">A site of your own</div>
        <div class="hl" data-layout-allow-overlap="true" id="s4-l2">works differently.</div>

        <div class="support" id="s4-sup">
          It sits at <b>a domain you own</b>, and it answers the question at two in
          the morning — without you.
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var F = 1 / 30;

          var world = document.getElementById("s4-w4");
          var cam = { scale: 1 };
          function applyCamera() {
            world.style.transform = "scale(" + cam.scale + ")";
          }
          applyCamera();
          tl.fromTo(
            cam,
            { scale: 1 },
            { scale: 1.05, duration: 7, ease: "none", onUpdate: applyCamera },
            0,
          );

          tl.fromTo("#s4-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.03);
          tl.fromTo("#s4-rl", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.12);

          function whip(sel, t, y, d) {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: d, ease: "power4.out" }, t);
          }
          /* Scene starts at 12.55; sentence 6 lands at 12.63 -> local 0.08. */
          var a = 0.15;
          whip("#s4-l1", a, 74, 0.19);
          var b = a + 0.19 - F;
          whip("#s4-l2", b, 60, 0.17);

          /* Sentence 7 lands at 14.55 -> local 2.00. */
          tl.fromTo(
            "#s4-sup",
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
            2.02,
          );

          window.__timelines["turn"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
