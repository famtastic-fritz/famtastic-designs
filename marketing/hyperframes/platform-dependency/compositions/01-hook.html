<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sub-composition. The runtime clones ONLY <template> contents, so every
         style, node and script this scene needs lives inside it. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper, #d8d1c2);
          color: var(--ink, #2a2126);
        }
        .stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .world {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        /* pd-a1 is framed tighter than the other plates: its upper half is a
           blown-out generation defect, so the crop is placed to keep that
           region above the paper band and out of the visible frame. */
        .plate {
          position: absolute;
          left: -110px;
          top: -560px;
          width: 1395px;
          height: 2500px;
          object-fit: cover;
        }
        .band {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1180px;
          background: linear-gradient(
            to bottom,
            var(--paper, #d8d1c2) 0px,
            var(--paper, #d8d1c2) 800px,
            rgba(216, 209, 194, 0) 1180px
          );
        }
        .eyebrow {
          position: absolute;
          left: 84px;
          top: 196px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--muted, #5a4f53);
          opacity: 0;
        }
        .rule {
          position: absolute;
          left: 84px;
          top: 254px;
          width: 200px;
          height: 12px;
          background: var(--accent, #7fb449);
          transform-origin: 0% 50%;
        }
        .hl {
          position: absolute;
          left: 84px;
          font-family: Oswald, sans-serif;
          font-weight: 700;
          font-size: 104px;
          line-height: 0.98;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          white-space: nowrap;
          opacity: 0;
        }
        #s1-l1 {
          top: 300px;
        }
        #s1-l2 {
          top: 414px;
        }
        #s1-l3 {
          top: 556px;
        }
        #s1-l4 {
          top: 670px;
        }
        .vignette {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(
            118% 76% at 50% 36%,
            rgba(51, 39, 46, 0) 38%,
            rgba(51, 39, 46, 0.09) 68%,
            rgba(51, 39, 46, 0.28) 100%
          );
        }
      </style>

      <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
        <div class="stage" data-layout-allow-overflow="true">
          <div class="world" id="s1-w1">
            <img class="plate" src="assets/plates/pd-a1-tight.jpg" alt="" />
          </div>
        </div>
        <div class="band"></div>
        <div class="vignette"></div>

        <div class="eyebrow" id="s1-eb">Platform dependency</div>
        <div class="rule" id="s1-rl"></div>
        <div class="hl" data-layout-allow-overlap="true" id="s1-l1">Your business</div>
        <div class="hl" data-layout-allow-overlap="true" id="s1-l2">is real.</div>
        <div class="hl" data-layout-allow-overlap="true" id="s1-l3">Your customers</div>
        <div class="hl" data-layout-allow-overlap="true" id="s1-l4">are real.</div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var F = 1 / 30;

          /* viewport-change: one continuous push, 1.00 -> 1.055 across the beat.
             Single wrapper, single source of truth for camera state. */
          var world = document.getElementById("s1-w1");
          var cam = { scale: 1 };
          function applyCamera() {
            world.style.transform = "scale(" + cam.scale + ")";
          }
          applyCamera();
          tl.fromTo(
            cam,
            { scale: 1 },
            { scale: 1.055, duration: 3.5, ease: "none", onUpdate: applyCamera },
            0,
          );

          /* Eyebrow + accent rule set the frame before any statement lands. */
          tl.fromTo("#s1-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);
          tl.fromTo("#s1-rl", { scaleX: 0 }, { scaleX: 1, duration: 0.44, ease: "power3.out" }, 0.34);

          /* waterfall-entry: binary 0 -> 1 opacity via tl.set, then whip to rest.
             Anchors travel further and settle longer than the lines they carry. */
          function whip(sel, t, y, d) {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: d, ease: "power4.out" }, t);
          }
          var a = 0.85;
          whip("#s1-l1", a, 78, 0.19);
          var b = a + 0.19 - F;
          whip("#s1-l2", b, 46, 0.15);

          var c = 2.18;
          whip("#s1-l3", c, 78, 0.19);
          var d = c + 0.19 - F;
          whip("#s1-l4", d, 46, 0.15);

          window.__timelines["hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
