<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Sub-composition. The assembler drops this file's own <head> styles and
         scripts, so everything the scene needs lives inside <template>. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper, #c5bca8);
          color: var(--ink, #241f1a);
        }
        .stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        /* The picture plate is the campaign's own video, native 1080x1920, so it
           needs no upscale and no crop. It is muted and silent-encoded; the bed
           is a separate <audio> in the host. The timing lives on the <video>
           itself — a plain ancestor carrying data-start as well is a lint error
           and produces wrong source frames. */
        .plate {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          object-fit: cover;
        }
        .band {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1000px;
          background: linear-gradient(
            to bottom,
            var(--paper, #c5bca8) 0px,
            var(--paper, #c5bca8) 820px,
            rgba(197, 188, 168, 0) 1000px
          );
        }
        .eyebrow {
          position: absolute;
          left: 84px;
          top: 196px;
          font-family: "Space Mono", monospace;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: var(--muted, #514839);
          opacity: 0;
        }
        .rule {
          position: absolute;
          left: 84px;
          top: 256px;
          width: 200px;
          height: 12px;
          background: var(--accent, #7fb449);
          transform-origin: 0% 50%;
        }
        .hl {
          position: absolute;
          left: 84px;
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 104px;
          line-height: 1;
          letter-spacing: -0.025em;
          text-transform: uppercase;
          white-space: nowrap;
          opacity: 0;
        }
        #c1-l1 {
          top: 310px;
        }
        #c1-l2 {
          top: 424px;
        }
        #c1-l3 {
          top: 538px;
        }
        .support {
          position: absolute;
          left: 84px;
          top: 700px;
          width: 862px;
          font-family: Outfit, sans-serif;
          font-weight: 400;
          font-size: 40px;
          line-height: 1.3;
          letter-spacing: -0.005em;
          color: var(--ink-soft, #544b42);
          opacity: 0;
        }
        .vignette {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(
            120% 78% at 50% 62%,
            rgba(51, 39, 46, 0) 34%,
            rgba(51, 39, 46, 0.06) 72%,
            rgba(51, 39, 46, 0.19) 100%
          );
        }
      </style>

      <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
        <div class="stage" data-layout-allow-overflow="true">
          <video data-color-grading="{&quot;preset&quot;:null,&quot;intensity&quot;:1,&quot;adjust&quot;:{&quot;exposure&quot;:0,&quot;contrast&quot;:0,&quot;highlights&quot;:0,&quot;shadows&quot;:0,&quot;whites&quot;:0,&quot;blacks&quot;:0,&quot;temperature&quot;:0,&quot;tint&quot;:0,&quot;vibrance&quot;:0,&quot;saturation&quot;:0},&quot;details&quot;:{&quot;vignette&quot;:0,&quot;vignetteMidpoint&quot;:0.5,&quot;vignetteRoundness&quot;:0,&quot;vignetteFeather&quot;:0.65,&quot;grain&quot;:0,&quot;grainSize&quot;:0.25,&quot;grainRoughness&quot;:0.5},&quot;effects&quot;:{&quot;blur&quot;:0,&quot;pixelate&quot;:0,&quot;chromaBleed&quot;:0,&quot;tapeDamage&quot;:0,&quot;tapeTracking&quot;:0,&quot;tapeNoise&quot;:1,&quot;tapeSpeed&quot;:0.5,&quot;filmArtifacts&quot;:0,&quot;halftone&quot;:0,&quot;halftoneSize&quot;:0,&quot;twoInkPrint&quot;:0,&quot;twoInkPrintSize&quot;:0,&quot;ascii&quot;:0,&quot;asciiSize&quot;:0.06578947368421052,&quot;asciiInvert&quot;:0,&quot;asciiStyle&quot;:0,&quot;asciiColor&quot;:1,&quot;asciiRotation&quot;:0,&quot;dither&quot;:0,&quot;ditherSize&quot;:0,&quot;bloom&quot;:0,&quot;bloomRadius&quot;:8,&quot;monoScreen&quot;:0,&quot;monoScreenSize&quot;:0,&quot;monoScreenAngle&quot;:0,&quot;monoScreenSpread&quot;:0,&quot;monoScreenShape&quot;:0,&quot;monoScreenInvert&quot;:0,&quot;scanlines&quot;:0,&quot;scanlineCount&quot;:0,&quot;scanlineSoftness&quot;:0,&quot;chromaticAberration&quot;:0,&quot;chromaticAngle&quot;:0,&quot;crtCurvature&quot;:0,&quot;digitalGlitch&quot;:0,&quot;digitalGlitchColorSplit&quot;:0,&quot;digitalGlitchLineTear&quot;:0,&quot;digitalGlitchPixelate&quot;:0,&quot;digitalGlitchBlockAmount&quot;:0,&quot;digitalGlitchBlockDisplacement&quot;:0,&quot;digitalGlitchBlockOpacity&quot;:0,&quot;digitalGlitchSpeed&quot;:0,&quot;engraving&quot;:0,&quot;engravingSpacing&quot;:0.4117647058823529,&quot;engravingMinThickness&quot;:0.2,&quot;engravingMaxThickness&quot;:0.4571428571428572,&quot;engravingAngle&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;,&quot;secondaries&quot;:[{&quot;enabled&quot;:true,&quot;key&quot;:{&quot;hue&quot;:{&quot;center&quot;:198,&quot;range&quot;:58,&quot;softness&quot;:34},&quot;saturation&quot;:{&quot;min&quot;:0.12,&quot;max&quot;:1,&quot;softness&quot;:0.15},&quot;luma&quot;:{&quot;min&quot;:0.02,&quot;max&quot;:1,&quot;softness&quot;:0.12}},&quot;correction&quot;:{&quot;hueShift&quot;:0,&quot;saturation&quot;:-0.78,&quot;luma&quot;:-0.04,&quot;temperature&quot;:0.12,&quot;tint&quot;:0}}]}" class="plate" id="c1-vid" src="assets/campus-dorm.mp4" data-start="0" data-duration="6.4" data-media-start="4.2" muted playsinline></video>
        </div>
        <div class="band"></div>
        <div class="vignette"></div>

        <div class="eyebrow" id="c1-eb">Between classes</div>
        <div class="rule" id="c1-rl"></div>
        <div class="hl" data-layout-allow-overlap="true" id="c1-l1">You already</div>
        <div class="hl" data-layout-allow-overlap="true" id="c1-l2">run a</div>
        <div class="hl" data-layout-allow-overlap="true" id="c1-l3">business.</div>
        <div class="support" id="c1-sp">
          Photography, tutoring, nails, resale, detailing, coaching. You have
          customers already.
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var F = 1 / 30;

          tl.fromTo("#c1-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);
          tl.fromTo("#c1-rl", { scaleX: 0 }, { scaleX: 1, duration: 0.44, ease: "power3.out" }, 0.34);

          /* waterfall-entry: binary 0 -> 1 opacity via tl.set, then whip to rest.
             Anchors travel further and settle longer than the lines they carry. */
          function whip(sel, t, y, d) {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: d, ease: "power4.out" }, t);
          }
          var a = 0.85;
          whip("#c1-l1", a, 78, 0.19);
          var b = a + 0.19 - F;
          whip("#c1-l2", b, 46, 0.15);
          var c = b + 0.15 - F;
          whip("#c1-l3", c, 46, 0.15);

          tl.fromTo(
            "#c1-sp",
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
            2.5,
          );

          window.__timelines["hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
