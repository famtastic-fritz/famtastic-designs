<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper, #c5bca8);
          color: var(--ink, #241f1a);
        }
        .eyebrow {
          position: absolute;
          left: 84px;
          top: 196px;
          font-family: "Space Mono", monospace;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: var(--muted, #514839);
          opacity: 0;
        }
        .rule {
          position: absolute;
          left: 84px;
          top: 256px;
          width: 200px;
          height: 12px;
          background: var(--accent, #7fb449);
          transform-origin: 0% 50%;
        }
        .hl {
          position: absolute;
          left: 84px;
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 88px;
          line-height: 1;
          letter-spacing: -0.025em;
          text-transform: uppercase;
          white-space: nowrap;
          opacity: 0;
        }
        #c2-l1 {
          top: 314px;
        }
        #c2-l2 {
          top: 412px;
        }
        #c2-l3 {
          top: 510px;
        }
        #c2-l4 {
          top: 608px;
        }
        /* The photograph is laid on the desk, not squared to it. The rotation is
           STATIC and lives on the wrapper — the timed animation only drops and
           settles the card, so no seek can land mid-rotation and the layout
           audit measures a stable rect. */
        .card-tilt {
          position: absolute;
          left: 84px;
          top: 760px;
          width: 912px;
          height: 800px;
          transform: rotate(-1.4deg);
          transform-origin: 50% 50%;
        }
        .card {
          position: absolute;
          inset: 0;
          overflow: hidden;
          border-radius: 6px;
          box-shadow:
            0 2px 0 rgba(51, 39, 46, 0.08),
            0 26px 58px rgba(51, 39, 46, 0.26);
          opacity: 0;
        }
        .card img {
          position: absolute;
          left: -124px;
          top: -180px;
          width: 1160px;
          height: 1160px;
          object-fit: cover;
        }
        .caption {
          position: absolute;
          left: 84px;
          top: 1618px;
          width: 912px;
          font-family: Outfit, sans-serif;
          font-weight: 400;
          font-size: 38px;
          line-height: 1.3;
          letter-spacing: -0.005em;
          color: var(--ink-soft, #544b42);
          opacity: 0;
        }
        .vignette {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(
            122% 80% at 50% 52%,
            rgba(51, 39, 46, 0) 40%,
            rgba(51, 39, 46, 0.07) 74%,
            rgba(51, 39, 46, 0.22) 100%
          );
        }
      </style>

      <div id="root" data-composition-id="desk" data-width="1080" data-height="1920">
        <div class="vignette"></div>

        <div class="eyebrow" id="c2-eb">So where does it live?</div>
        <div class="rule" id="c2-rl"></div>
        <div class="hl" data-layout-allow-overlap="true" id="c2-l1">In a DM.</div>
        <div class="hl" data-layout-allow-overlap="true" id="c2-l2">In a bio link.</div>
        <div class="hl" data-layout-allow-overlap="true" id="c2-l3">In somebody</div>
        <div class="hl" data-layout-allow-overlap="true" id="c2-l4">else’s app.</div>

        <div class="card-tilt" data-layout-allow-overflow="true">
          <div class="card" id="c2-cd">
            <img data-color-grading="{&quot;preset&quot;:null,&quot;intensity&quot;:1,&quot;adjust&quot;:{&quot;exposure&quot;:0,&quot;contrast&quot;:0,&quot;highlights&quot;:0,&quot;shadows&quot;:0,&quot;whites&quot;:0,&quot;blacks&quot;:0,&quot;temperature&quot;:0,&quot;tint&quot;:0,&quot;vibrance&quot;:0,&quot;saturation&quot;:0},&quot;details&quot;:{&quot;vignette&quot;:0,&quot;vignetteMidpoint&quot;:0.5,&quot;vignetteRoundness&quot;:0,&quot;vignetteFeather&quot;:0.65,&quot;grain&quot;:0,&quot;grainSize&quot;:0.25,&quot;grainRoughness&quot;:0.5},&quot;effects&quot;:{&quot;blur&quot;:0,&quot;pixelate&quot;:0,&quot;chromaBleed&quot;:0,&quot;tapeDamage&quot;:0,&quot;tapeTracking&quot;:0,&quot;tapeNoise&quot;:1,&quot;tapeSpeed&quot;:0.5,&quot;filmArtifacts&quot;:0,&quot;halftone&quot;:0,&quot;halftoneSize&quot;:0,&quot;twoInkPrint&quot;:0,&quot;twoInkPrintSize&quot;:0,&quot;ascii&quot;:0,&quot;asciiSize&quot;:0.06578947368421052,&quot;asciiInvert&quot;:0,&quot;asciiStyle&quot;:0,&quot;asciiColor&quot;:1,&quot;asciiRotation&quot;:0,&quot;dither&quot;:0,&quot;ditherSize&quot;:0,&quot;bloom&quot;:0,&quot;bloomRadius&quot;:8,&quot;monoScreen&quot;:0,&quot;monoScreenSize&quot;:0,&quot;monoScreenAngle&quot;:0,&quot;monoScreenSpread&quot;:0,&quot;monoScreenShape&quot;:0,&quot;monoScreenInvert&quot;:0,&quot;scanlines&quot;:0,&quot;scanlineCount&quot;:0,&quot;scanlineSoftness&quot;:0,&quot;chromaticAberration&quot;:0,&quot;chromaticAngle&quot;:0,&quot;crtCurvature&quot;:0,&quot;digitalGlitch&quot;:0,&quot;digitalGlitchColorSplit&quot;:0,&quot;digitalGlitchLineTear&quot;:0,&quot;digitalGlitchPixelate&quot;:0,&quot;digitalGlitchBlockAmount&quot;:0,&quot;digitalGlitchBlockDisplacement&quot;:0,&quot;digitalGlitchBlockOpacity&quot;:0,&quot;digitalGlitchSpeed&quot;:0,&quot;engraving&quot;:0,&quot;engravingSpacing&quot;:0.4117647058823529,&quot;engravingMinThickness&quot;:0.2,&quot;engravingMaxThickness&quot;:0.4571428571428572,&quot;engravingAngle&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;,&quot;secondaries&quot;:[{&quot;enabled&quot;:true,&quot;key&quot;:{&quot;hue&quot;:{&quot;center&quot;:212,&quot;range&quot;:56,&quot;softness&quot;:36},&quot;saturation&quot;:{&quot;min&quot;:0.18,&quot;max&quot;:1,&quot;softness&quot;:0.15},&quot;luma&quot;:{&quot;min&quot;:0.05,&quot;max&quot;:1,&quot;softness&quot;:0.12}},&quot;correction&quot;:{&quot;hueShift&quot;:0,&quot;saturation&quot;:-0.6,&quot;luma&quot;:-0.02,&quot;temperature&quot;:0.14,&quot;tint&quot;:0}}]}" id="c2-img" src="assets/plates/cm-quad.jpg" alt="">
          </div>
        </div>

        <div class="caption" id="c2-cp">
          Every one of those is somebody else’s address.
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var F = 1 / 30;

          tl.fromTo("#c2-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.14);
          tl.fromTo("#c2-rl", { scaleX: 0 }, { scaleX: 1, duration: 0.44, ease: "power3.out" }, 0.26);

          function whip(sel, t, y, d) {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: d, ease: "power4.out" }, t);
          }
          var a = 0.7;
          whip("#c2-l1", a, 64, 0.18);
          var b = a + 0.18 - F;
          whip("#c2-l2", b, 44, 0.15);
          var c = b + 0.15 - F;
          whip("#c2-l3", c, 44, 0.15);
          var d = c + 0.15 - F;
          whip("#c2-l4", d, 44, 0.15);

          /* The card is dropped onto the desk: it falls a short way and settles,
             it does not slide in from an edge. */
          tl.fromTo(
            "#c2-cd",
            { opacity: 0, y: -26, scale: 1.012 },
            { opacity: 1, y: 0, scale: 1, duration: 0.56, ease: "power3.out" },
            0.14,
          );

          tl.fromTo(
            "#c2-cp",
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
            1.5,
          );

          window.__timelines["desk"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
