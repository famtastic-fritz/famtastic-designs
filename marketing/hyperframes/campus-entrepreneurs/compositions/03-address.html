<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper, #c5bca8);
          color: var(--ink, #241f1a);
        }
        .stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .world {
          position: absolute;
          inset: 0;
          transform-origin: 50% 66%;
          will-change: transform;
        }
        .plate {
          position: absolute;
          left: -54px;
          top: -104px;
          width: 1188px;
          height: 2128px;
          object-fit: cover;
        }
        .band {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1060px;
          background: linear-gradient(
            to bottom,
            var(--paper, #c5bca8) 0px,
            var(--paper, #c5bca8) 880px,
            rgba(197, 188, 168, 0) 1060px
          );
        }
        .eyebrow {
          position: absolute;
          left: 84px;
          top: 196px;
          font-family: "Space Mono", monospace;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: var(--muted, #514839);
          opacity: 0;
        }
        /* No olive rule on this beat. The photograph already carries the film's
           accent — the small olive clip beside the card holder — so adding one
           here would double the green rather than keep it to one incident. */
        .tick {
          position: absolute;
          left: 84px;
          top: 256px;
          width: 200px;
          height: 8px;
          background: var(--rule, #b4aa97);
          transform-origin: 0% 50%;
        }
        .hl {
          position: absolute;
          left: 84px;
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 96px;
          line-height: 1;
          letter-spacing: -0.025em;
          text-transform: uppercase;
          white-space: nowrap;
          opacity: 0;
        }
        #c3-l1 {
          top: 316px;
        }
        #c3-l2 {
          top: 422px;
        }
        #c3-l3 {
          top: 528px;
        }
        .support {
          position: absolute;
          left: 84px;
          top: 690px;
          width: 866px;
          font-family: Outfit, sans-serif;
          font-weight: 400;
          font-size: 40px;
          line-height: 1.3;
          letter-spacing: -0.005em;
          color: var(--ink-soft, #544b42);
          opacity: 0;
        }
        .support b {
          font-weight: 400;
          color: var(--ink, #241f1a);
        }
        .vignette {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(
            120% 78% at 50% 66%,
            rgba(51, 39, 46, 0) 32%,
            rgba(51, 39, 46, 0.06) 72%,
            rgba(51, 39, 46, 0.19) 100%
          );
        }
      </style>

      <div id="root" data-composition-id="address" data-width="1080" data-height="1920">
        <div class="stage" data-layout-allow-overflow="true">
          <div class="world" id="c3-w">
            <img class="plate" src="assets/plates/cm-card.jpg" alt="" />
          </div>
        </div>
        <div class="band"></div>
        <div class="vignette"></div>

        <div class="eyebrow" id="c3-eb">Own the address</div>
        <div class="tick" id="c3-tk"></div>
        <div class="hl" data-layout-allow-overlap="true" id="c3-l1">One page</div>
        <div class="hl" data-layout-allow-overlap="true" id="c3-l2">with your</div>
        <div class="hl" data-layout-allow-overlap="true" id="c3-l3">name on it.</div>
        <div class="support" id="c3-sp">
          Not a profile inside an app. <b>A web address that is yours</b> &mdash;
          one a customer can find, type, and come back to.
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var F = 1 / 30;

          /* viewport-change: one continuous push, 1.00 -> 1.045 across the beat. */
          var world = document.getElementById("c3-w");
          var cam = { scale: 1 };
          function applyCamera() {
            world.style.transform = "scale(" + cam.scale + ")";
          }
          applyCamera();
          tl.fromTo(
            cam,
            { scale: 1 },
            { scale: 1.045, duration: 6, ease: "none", onUpdate: applyCamera },
            0,
          );

          tl.fromTo("#c3-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.14);
          tl.fromTo("#c3-tk", { scaleX: 0 }, { scaleX: 1, duration: 0.44, ease: "power3.out" }, 0.26);

          function whip(sel, t, y, d) {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: d, ease: "power4.out" }, t);
          }
          var a = 0.7;
          whip("#c3-l1", a, 70, 0.19);
          var b = a + 0.19 - F;
          whip("#c3-l2", b, 44, 0.15);
          var c = b + 0.15 - F;
          whip("#c3-l3", c, 44, 0.15);

          tl.fromTo(
            "#c3-sp",
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
            2.1,
          );

          window.__timelines["address"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
