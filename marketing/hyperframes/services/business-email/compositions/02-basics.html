<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper, #d2c9be);
          color: var(--ink, #33272e);
        }
        .stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .world {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .plate {
          position: absolute;
          left: -54px;
          top: -104px;
          width: 1188px;
          height: 2128px;
          object-fit: cover;
        }
        /* split: a full-width band of held colour cut across the photograph,
           with the lower edge on a slight diagonal so the frame does not read
           as two stacked rectangles. The photograph stays visible above AND
           below it — that is what separates this from a header band. */
        .band {
          position: absolute;
          left: 0;
          width: 1080px;
          background: linear-gradient(
            to bottom,
            var(--paper, #d2c9be) 0%,
            var(--paper, #d2c9be) 68%,
            var(--paper-edge, #c6bcae) 100%
          );
          opacity: 0;
        }
        #b2-band {
          top: 440px;
          height: 740px;
          clip-path: polygon(0 0, 1080px 0, 1080px 690px, 0 740px);
        }
        .eyebrow {
          position: absolute;
          left: 84px;
          top: 580px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--muted, #625860);
          opacity: 0;
        }
        .rule {
          position: absolute;
          left: 84px;
          top: 638px;
          width: 260px;
          height: 16px;
          background: var(--accent, #7fb449);
          transform-origin: 0% 50%;
        }
        #b2-hl {
          position: absolute;
          left: 84px;
          top: 692px;
          font-family: Oswald, sans-serif;
          font-weight: 700;
          font-size: 96px;
          line-height: 0.98;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          white-space: nowrap;
          opacity: 0;
        }
        .mk {
          position: absolute;
          left: 84px;
          width: 16px;
          height: 16px;
          background: var(--accent, #7fb449);
          opacity: 0;
        }
        .item {
          position: absolute;
          left: 134px;
          width: 862px;
          font-family: Inter, sans-serif;
          font-weight: 400;
          font-size: 40px;
          line-height: 1.2;
          letter-spacing: -0.01em;
          color: var(--ink, #33272e);
          white-space: nowrap;
          opacity: 0;
        }
        #b2-m1 {
          top: 854px;
        }
        #b2-i1 {
          top: 840px;
        }
        #b2-m2 {
          top: 944px;
        }
        #b2-i2 {
          top: 930px;
        }
        #b2-m3 {
          top: 1034px;
        }
        #b2-i3 {
          top: 1020px;
        }
      </style>

      <div id="root" data-composition-id="basics" data-width="1080" data-height="1920">
        <div class="stage" data-layout-allow-overflow="true">
          <div class="world" id="b2-w">
            <img class="plate" src="assets/plate-holder.jpg" alt="" />
          </div>
        </div>

        <div class="band" id="b2-band"></div>

        <div class="eyebrow" id="b2-eb">Web Basics Bundle &middot; $199</div>
        <div class="rule" id="b2-rl"></div>
        <div id="b2-hl">Three things.</div>

        <div class="mk" id="b2-m1"></div>
        <div class="item" id="b2-i1">One landing-page website</div>
        <div class="mk" id="b2-m2"></div>
        <div class="item" id="b2-i2">One year of managed hosting</div>
        <div class="mk" id="b2-m3"></div>
        <div class="item" id="b2-i3">Your domain, new or already yours</div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          var F = 1 / 30;

          /* viewport-change: one continuous push. Beats 2 and 3 share this
             photograph, so this beat runs 1.000 -> 1.040 and beat 3 picks up
             at 1.040 — the seam between the two scenes is the same frame. */
          var world = document.getElementById("b2-w");
          var cam = { scale: 1 };
          function applyCamera() {
            world.style.transform = "scale(" + cam.scale + ")";
          }
          applyCamera();
          tl.fromTo(
            cam,
            { scale: 1 },
            { scale: 1.04, duration: 8.52, ease: "none", onUpdate: applyCamera },
            0,
          );

          tl.fromTo("#b2-band", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0);
          tl.fromTo("#b2-eb", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.22);
          tl.fromTo("#b2-rl", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.34);

          /* "Web basics is..." starts at 9.79 on the film clock, 0.09 into this
             beat. The headline lands with it. */
          tl.set("#b2-hl", { opacity: 1, y: 70 }, 0.5);
          tl.to("#b2-hl", { y: 0, duration: 0.19, ease: "power4.out" }, 0.5);

          /* waterfall-entry, one row per clause of the narration:
             "one landing page website" (10.38-11.98), "one year of managed
             hosting" (12.04-13.69), "and your domain..." (13.82-18.12).
             Beat-local times are film time minus 9.70. */
          function item(n, t) {
            tl.set("#b2-i" + n, { opacity: 1, y: 40 }, t);
            tl.to("#b2-i" + n, { y: 0, duration: 0.17, ease: "power4.out" }, t);
            tl.fromTo(
              "#b2-m" + n,
              { opacity: 0, scale: 0.4 },
              { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(2)" },
              t + 0.04,
            );
          }
          item(1, 0.72);
          item(2, 2.36);
          item(3, 4.14);

          window.__timelines["basics"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
