<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sub-composition. The runtime clones ONLY <template> contents, so every
         style, node and script this scene needs lives inside it. Ids are
         prefixed (b1-) because every sub-composition is inlined into one
         document and a bare selector would resolve across scenes. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper, #d2c9be);
          color: var(--ink, #33272e);
        }
        .eyebrow {
          position: absolute;
          left: 84px;
          top: 196px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--muted, #625860);
          opacity: 0;
        }
        .rule {
          position: absolute;
          left: 84px;
          top: 254px;
          width: 260px;
          height: 16px;
          background: var(--accent, #7fb449);
          transform-origin: 0% 50%;
        }
        .hl {
          position: absolute;
          left: 84px;
          font-family: Oswald, sans-serif;
          font-weight: 700;
          font-size: 80px;
          line-height: 0.98;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          white-space: nowrap;
          opacity: 0;
        }
        #b1-l1 {
          top: 306px;
        }
        #b1-l2 {
          top: 386px;
        }
        /* famPanel: a block of held colour the answer sits inside. On a light
           ground the strongest possible emphasis is to invert, not to enlarge —
           and the answer to this question is the whole reason the film exists,
           so it gets the only inverted block in the piece. */
        #b1-panel {
          position: absolute;
          left: 84px;
          top: 470px;
          width: 660px;
          height: 180px;
          background: var(--ink, #33272e);
          transform-origin: 0% 50%;
        }
        #b1-ans {
          position: absolute;
          left: 128px;
          top: 502px;
          font-family: Oswald, sans-serif;
          font-weight: 700;
          font-size: 84px;
          line-height: 1;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: var(--paper, #d2c9be);
          white-space: nowrap;
          opacity: 0;
        }
        #b1-sup {
          position: absolute;
          left: 84px;
          top: 700px;
          width: 640px;
          font-family: Inter, sans-serif;
          font-weight: 400;
          font-size: 36px;
          line-height: 1.34;
          letter-spacing: -0.01em;
          color: var(--ink-soft, #57484f);
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="question" data-width="1080" data-height="1920">
        <div class="eyebrow" id="b1-eb">A question we get a lot</div>
        <div class="rule" id="b1-rl"></div>
        <div class="hl" data-layout-allow-overlap="true" id="b1-l1">Does the $199 website</div>
        <div class="hl" data-layout-allow-overlap="true" id="b1-l2">come with business email?</div>

        <div id="b1-panel"></div>
        <div id="b1-ans">It does not.</div>

        <div id="b1-sup">We would rather say that plainly than let you find out later.</div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          var F = 1 / 30;

          tl.fromTo("#b1-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);
          tl.fromTo("#b1-rl", { scaleX: 0 }, { scaleX: 1, duration: 0.44, ease: "power3.out" }, 0.34);

          /* waterfall-entry on the question. The two lines land under
             "Here's a question we get a lot," (ends 1.66) and the question
             itself (1.92 - 5.69). */
          function whip(sel, t, y, d) {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: d, ease: "power4.out" }, t);
          }
          var a = 1.9;
          whip("#b1-l1", a, 66, 0.19);
          whip("#b1-l2", a + 0.19 - F, 44, 0.15);

          /* The answer lands on the word. The narration says "It does not."
             starting at 5.69s; the panel wipes open a beat before so the words
             arrive into a block that is already there. */
          tl.fromTo("#b1-panel", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power4.out" }, 5.5);
          tl.fromTo("#b1-ans", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 5.72);

          /* "We would rather say that plainly..." runs 6.70 - 9.60. */
          tl.fromTo("#b1-sup", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 6.72);

          window.__timelines["question"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
