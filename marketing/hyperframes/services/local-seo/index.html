<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Found, Then Kept — Local SEO and Maintenance</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      /* Design tokens — frame.md is the source of truth. The ground is
         `ghost-town` turned to its daylight half: bone and sand rather than
         #17120D earth, because the anchor-matching contract needs a light
         frame. The accent stays the measured #7FB449, not ghost-town's amber —
         the amber in this film is the low sun in the photographs, which is
         where it belongs. */
      body {
        --paper: #ccc2ac;
        --paper-edge: #beb298;
        --ink: #2a2118;
        --ink-soft: #4e4234;
        --muted: #5c5040;
        --shadow: #33272e;
        --accent: #7fb449;
        --rule: #9c8e73;
        background: var(--paper);
        font-family: Inter, sans-serif;
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--paper);
      }
      /* Untimed base — no frame is ever transparent, including the seam frames
         between two scene slots. */
      #base {
        position: absolute;
        inset: 0;
        background: var(--paper);
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div id="base"></div>

      <div
        id="hook"
        class="clip"
        data-composition-id="hook"
        data-composition-src="compositions/01-hook.html"
        data-start="0"
        data-duration="5.6"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="mechanism"
        class="clip"
        data-composition-id="mechanism"
        data-composition-src="compositions/02-mechanism.html"
        data-start="5.6"
        data-duration="7"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="setup"
        class="clip"
        data-composition-id="setup"
        data-composition-src="compositions/03-setup.html"
        data-start="12.6"
        data-duration="6"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="kept"
        class="clip"
        data-composition-id="kept"
        data-composition-src="compositions/04-kept.html"
        data-start="18.6"
        data-duration="5.4"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="close"
        class="clip"
        data-composition-id="close"
        data-composition-src="compositions/05-close.html"
        data-start="24"
        data-duration="4"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>

    <!-- No <audio>. This film is silent by construction, not by oversight:
         the repo holds no approved narration for local search or maintenance
         and no licensed music, and this task authorised no provider spend.
         The pacing is set for reading, not for a voice that is not there.
         See README.md "Limitations hit". -->

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        // The host owns no animated element of its own; every beat animates
        // inside its sub-composition. An empty registered timeline keeps the
        // root seekable and explicit rather than implicit.
        window.__timelines["main"] = gsap.timeline({ paused: true });
      })();
    </script>
  </body>
</html>
