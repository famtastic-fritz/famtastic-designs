<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sub-composition. The assembler drops this file's own <head> styles and
         scripts, so everything the scene needs lives inside <template>. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--earth, #17120d);
          color: var(--bone, #e3d6bb);
        }
        .stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .world {
          position: absolute;
          inset: 0;
          transform-origin: 50% 42%;
          will-change: transform;
        }
        .plate {
          position: absolute;
          left: -54px;
          top: -104px;
          width: 1188px;
          height: 2128px;
          object-fit: cover;
        }
        /* The earth band the type sits on. Solid to 700, then 200px of fade so
           the join to the photograph is never a line. */
        .band {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 900px;
          background: linear-gradient(
            to bottom,
            var(--earth, #17120d) 0px,
            var(--earth, #17120d) 700px,
            rgba(23, 18, 13, 0) 900px
          );
        }
        .eyebrow {
          position: absolute;
          left: 84px;
          top: 196px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 600;
          font-size: 30px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--dust, #8a7c63);
          opacity: 0;
        }
        /* The light shaft — the whole accent budget for this beat. */
        .shaft {
          position: absolute;
          left: 84px;
          top: 254px;
          width: 232px;
          height: 4px;
          background: var(--amber, #d9a441);
          transform-origin: 0% 50%;
        }
        .hl {
          position: absolute;
          left: 84px;
          font-family: "League Gothic", sans-serif;
          font-weight: 400;
          font-size: 116px;
          line-height: 0.94;
          letter-spacing: 0.005em;
          text-transform: uppercase;
          white-space: nowrap;
          color: var(--bone, #e3d6bb);
          opacity: 0;
        }
        #s1-l1 {
          top: 306px;
        }
        #s1-l2 {
          top: 424px;
        }
        #s1-l3 {
          top: 542px;
        }
        .support {
          position: absolute;
          left: 84px;
          top: 712px;
          width: 852px;
          font-family: Roboto, sans-serif;
          font-weight: 400;
          font-size: 40px;
          line-height: 1.32;
          letter-spacing: -0.005em;
          color: var(--sand, #b6a482);
          opacity: 0;
        }
        .vignette {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(
            120% 78% at 50% 40%,
            rgba(13, 10, 7, 0) 34%,
            rgba(13, 10, 7, 0.22) 68%,
            rgba(13, 10, 7, 0.6) 100%
          );
        }
      </style>

      <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
        <div class="stage" data-layout-allow-overflow="true">
          <div class="world" id="s1-w">
            <img class="plate" src="assets/plates/gt-a2.jpg" alt="" />
          </div>
        </div>
        <div class="band"></div>
        <div class="vignette"></div>

        <div class="eyebrow" id="s1-eb">Search: &ldquo;hair stylist near me&rdquo;</div>
        <div class="shaft" id="s1-sh"></div>
        <div class="hl" data-layout-allow-overlap="true" id="s1-l1">Are you</div>
        <div class="hl" data-layout-allow-overlap="true" id="s1-l2">in the</div>
        <div class="hl" data-layout-allow-overlap="true" id="s1-l3">results?</div>
        <div class="support" id="s1-sp">
          Not the app&rsquo;s results. The ones a stranger sees when they go looking for
          a stylist in your city.
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var F = 1 / 30;

          /* viewport-change: one continuous push, 1.00 -> 1.048 across the beat. */
          var world = document.getElementById("s1-w");
          var cam = { scale: 1 };
          function applyCamera() {
            world.style.transform = "scale(" + cam.scale + ")";
          }
          applyCamera();
          tl.fromTo(
            cam,
            { scale: 1 },
            { scale: 1.048, duration: 7.2, ease: "none", onUpdate: applyCamera },
            0,
          );

          /* The search box, then the light. */
          tl.fromTo("#s1-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);
          tl.fromTo("#s1-sh", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.34);

          /* waterfall-entry: binary 0 -> 1 opacity via tl.set, then whip to rest.
             Anchors travel further and settle longer than the lines they carry. */
          function whip(sel, t, y, d) {
            tl.set(sel, { opacity: 1, y: y }, t);
            tl.to(sel, { y: 0, duration: d, ease: "power4.out" }, t);
          }
          var a = 0.9;
          whip("#s1-l1", a, 80, 0.2);
          var b = a + 0.2 - F;
          whip("#s1-l2", b, 48, 0.16);
          var c = b + 0.16 - F;
          whip("#s1-l3", c, 48, 0.16);

          tl.fromTo(
            "#s1-sp",
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
            2.7,
          );

          window.__timelines["hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
