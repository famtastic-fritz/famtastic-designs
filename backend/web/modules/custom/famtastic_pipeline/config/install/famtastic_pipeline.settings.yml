# Non-secret pipeline configuration.
# Secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, SMTP_*) are read from
# environment variables via settings, NEVER stored here.
token_ttl_days: 14
frontend_base_url: 'http://localhost:5173'
support_from_email: 'hello@famtasticdesigns.com'
notification_to_email: 'fitzgerald.medine@gmail.com'
lead_response_sla_days: 3
sla_alerts_enabled: true
legacy_checkout_enabled: false
# Site Studio proof generation endpoint. Empty = built-in stub generator.
studio_url: ''
# The website proof runner is an explicit dispatch boundary. It remains
# fail-closed until one of these routes is deliberately configured:
# - site_studio_dispatch: uses the signed Site Studio dispatch boundary;
# - external_runner: uses proof_runner_external_url plus an environment secret;
# - local_contract_fixture: test plumbing only and additionally requires
#   FAMTASTIC_ALLOW_LOCAL_CONTRACT_FIXTURE=1.
# It never sends email, stages a public room, charges, or publishes.
proof_runner_transport: disabled
proof_runner_external_url: ''
proof_runner_default_build_class: low
# Public base URL for proof previews (scheme+host+path prefix, no trailing
# slash). Empty = {request scheme+host}/web/proofs.
proofs_base_url: ''
package:
  id: basic_199
  name: 'FAMtastic Basic Website'
  tagline: 'A professional, mobile-ready website built for your business — launched fast.'
  amount: 19900
  currency: usd
  inclusions:
    - 'Custom mobile-responsive website (core pages)'
    - 'Your business info, services, and contact details'
    - 'Contact / lead capture form'
    - 'Basic SEO foundation'
    - 'One included revision'
    - 'Launch support'
