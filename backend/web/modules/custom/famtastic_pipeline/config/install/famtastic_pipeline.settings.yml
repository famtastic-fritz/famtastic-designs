# Non-secret pipeline configuration.
# Secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, SMTP_*) are read from
# environment variables via settings, NEVER stored here.
token_ttl_days: 14
frontend_base_url: 'http://localhost:5173'
# Public Drupal document root for click/unsubscribe API links. Empty derives
# as {frontend_base_url}/web when the frontend lives at the origin.
public_api_base_url: ''
support_from_email: 'hello@famtasticdesigns.com'
notification_to_email: 'fitzgerald.medine@gmail.com'
lead_response_sla_days: 3
sla_alerts_enabled: true
# A governed pilot deployment may turn this on before an exact-ID public
# preview run. It is deliberately durable so fresh cPanel `drush cron`
# processes cannot fall back to general queue or outbox dispatch. Normal
# releases explicitly turn it back off.
pilot_exact_dispatch_only: false
legacy_checkout_enabled: false
# Public request-to-book is deliberately opt-in per microsite. A code release
# alone must never begin collecting appointment requests for a client.
booking_request_enabled_sites: []
# Availability is separately opt-in. Publishing a request window never creates
# a calendar event or changes an external booking provider.
booking_availability_enabled_sites: []
# Site Studio proof generation endpoint. Empty = built-in stub generator.
studio_url: ''
# Public base URL for proof previews (scheme+host+path prefix, no trailing
# slash). Empty = {request scheme+host}/web/proofs.
proofs_base_url: ''
package:
  id: basic_199
  name: 'FAMtastic Basic Website'
  tagline: 'A professional, mobile-ready website built for your business — launched fast.'
  amount: 19900
  currency: usd
  inclusions:
    - 'Custom mobile-responsive website (core pages)'
    - 'Your business info, services, and contact details'
    - 'Contact / lead capture form'
    - 'Basic SEO foundation'
    - 'One included revision'
    - 'Launch support'
