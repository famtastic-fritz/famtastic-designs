famtastic_pipeline.settings:
  type: config_object
  label: 'FAMtastic Pipeline settings'
  mapping:
    token_ttl_days:
      type: integer
      label: 'Prospect link token TTL (days)'
    frontend_base_url:
      type: string
      label: 'Frontend base URL'
    public_api_base_url:
      type: string
      label: 'Public Drupal API base URL'
    support_from_email:
      type: string
      label: 'Support from email'
    notification_to_email:
      type: string
      label: 'Notification recipient email'
    lead_response_sla_days:
      type: integer
      label: 'Lead first-response SLA in days'
    sla_alerts_enabled:
      type: boolean
      label: 'Send overdue lead alerts'
    pilot_exact_dispatch_only:
      type: boolean
      label: 'Disable general automation and outbox dispatch for an exact-ID pilot'
    legacy_checkout_enabled:
      type: boolean
      label: 'Allow the legacy prospect-token checkout'
    package:
      type: mapping
      label: 'Offer package'
      mapping:
        id:
          type: string
          label: 'Package id'
        name:
          type: string
          label: 'Package name'
        tagline:
          type: string
          label: 'Tagline'
        amount:
          type: integer
          label: 'Amount (minor units)'
        currency:
          type: string
          label: 'Currency'
        inclusions:
          type: sequence
          label: 'Inclusions'
          sequence:
            type: string
            label: 'Inclusion'

famtastic_pipeline.proof_cohorts:
  type: config_object
  label: 'FAMtastic proof cohort profiles'
  mapping:
    anonymous:
      type: mapping
      label: 'Anonymous public proof profiles'
      mapping:
        default_profile:
          type: string
          label: 'Default anonymous profile ID'
        profiles:
          type: sequence
          label: 'Named anonymous profiles'
          sequence:
            type: mapping
            label: 'Anonymous profile'
            mapping:
              audience:
                type: string
                label: 'Audience'
              direction_count:
                type: integer
                label: 'Direction count'
              directions:
                type: sequence
                label: 'Direction contract'
                sequence:
                  type: mapping
                  label: 'Direction'
                  mapping:
                    name:
                      type: string
                      label: 'Direction label'
                    intent:
                      type: string
                      label: 'Direction intent'
    cold:
      type: mapping
      label: 'Verified cold-proof eligibility'
      mapping:
        website_observation_statuses:
          type: sequence
          label: 'Allowed explicit website observation statuses'
          sequence:
            type: string
            label: 'Observation status'
