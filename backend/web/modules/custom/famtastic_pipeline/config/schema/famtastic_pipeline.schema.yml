famtastic_pipeline.settings:
  type: config_object
  label: 'FAMtastic Pipeline settings'
  mapping:
    token_ttl_days:
      type: integer
      label: 'Prospect link token TTL (days)'
    frontend_base_url:
      type: string
      label: 'Frontend base URL'
    support_from_email:
      type: string
      label: 'Support from email'
    notification_to_email:
      type: string
      label: 'Notification recipient email'
    lead_response_sla_days:
      type: integer
      label: 'Lead first-response SLA in days'
    sla_alerts_enabled:
      type: boolean
      label: 'Send overdue lead alerts'
    legacy_checkout_enabled:
      type: boolean
      label: 'Allow the legacy prospect-token checkout'
    proof_runner_transport:
      type: string
      label: 'Proof runner transport'
    proof_runner_external_url:
      type: string
      label: 'External proof runner URL'
    proof_runner_default_build_class:
      type: string
      label: 'Default proof runner build class'
    package:
      type: mapping
      label: 'Offer package'
      mapping:
        id:
          type: string
          label: 'Package id'
        name:
          type: string
          label: 'Package name'
        tagline:
          type: string
          label: 'Tagline'
        amount:
          type: integer
          label: 'Amount (minor units)'
        currency:
          type: string
          label: 'Currency'
        inclusions:
          type: sequence
          label: 'Inclusions'
          sequence:
            type: string
            label: 'Inclusion'
