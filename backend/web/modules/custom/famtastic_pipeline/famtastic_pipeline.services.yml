services:
  logger.channel.famtastic_pipeline:
    parent: logger.channel_base
    arguments: ['famtastic_pipeline']

  famtastic_pipeline.token_manager:
    class: Drupal\famtastic_pipeline\Service\TokenManager
    arguments: ['@config.factory', '@datetime.time']

  famtastic_pipeline.repository:
    class: Drupal\famtastic_pipeline\Service\PipelineRepository
    arguments: ['@entity_type.manager', '@famtastic_pipeline.token_manager', '@datetime.time']

  famtastic_pipeline.operational_ledger:
    class: Drupal\famtastic_pipeline\Service\OperationalLedger
    arguments: ['@database', '@datetime.time']

  famtastic_pipeline.lead_ingestion:
    class: Drupal\famtastic_pipeline\Service\LeadIngestionService
    arguments: ['@database', '@entity_type.manager', '@famtastic_pipeline.operational_ledger', '@datetime.time']

  famtastic_pipeline.proof_cohort_profiles:
    class: Drupal\famtastic_pipeline\Service\ProofCohortProfileService
    arguments: ['@config.factory']

  # This must read durable Drupal config because cPanel launches scheduled
  # Drush commands without the deployment shell environment.
  famtastic_pipeline.pilot_exact_dispatch_lock:
    class: Drupal\famtastic_pipeline\Service\PilotExactDispatchLock
    arguments: ['@config.factory']

  Drupal\famtastic_pipeline\Service\ProofCohortProfileResolverInterface: '@famtastic_pipeline.proof_cohort_profiles'

  famtastic_pipeline.cold_proof_seed_validator:
    class: Drupal\famtastic_pipeline\Service\ColdProofCampaignSeedValidator
    arguments: ['@config.factory']

  famtastic_pipeline.cold_proof_ingress:
    class: Drupal\famtastic_pipeline\Service\ColdProofIngressService
    arguments: ['@database', '@entity_type.manager', '@datetime.time', '@famtastic_pipeline.lead_ingestion', '@famtastic_pipeline.public_preview_deliveries', '@famtastic_pipeline.proof_campaign_service', '@famtastic_pipeline.proof_cohort_profiles', '@famtastic_pipeline.cold_proof_seed_validator', '@famtastic_pipeline.operational_ledger']

  famtastic_pipeline.cold_proof_commercial_messages:
    class: Drupal\famtastic_pipeline\Service\ColdProofCommercialMessageService
    arguments: ['@database', '@config.factory', '@datetime.time', '@famtastic_pipeline.operational_ledger', '@famtastic_pipeline.mailer']

  famtastic_pipeline.verified_cold_outreach_gate:
    class: Drupal\famtastic_pipeline\Service\VerifiedColdOutreachGate

  famtastic_pipeline.public_preview_content_guard:
    class: Drupal\famtastic_pipeline\Service\PublicPreviewContentGuard

  famtastic_pipeline.cold_proof_scheduled_release:
    class: Drupal\famtastic_pipeline\Service\ColdProofScheduledReleaseService
    arguments: ['@database', '@datetime.time']

  famtastic_pipeline.cold_proof_build_handoff:
    class: Drupal\famtastic_pipeline\Service\ColdProofBuildHandoffService
    arguments: ['@database', '@entity_type.manager', '@datetime.time', '@famtastic_pipeline.public_preview_deliveries']

  famtastic_pipeline.automation_worker:
    class: Drupal\famtastic_pipeline\Service\AutomationWorker
    arguments: ['@famtastic_pipeline.operational_ledger', '@entity_type.manager', '@famtastic_pipeline.proof_campaign_service', '@famtastic_pipeline.campaign_messages', '@famtastic_pipeline.customer_deployment', '@famtastic_pipeline.domain_lifecycle', '@famtastic_pipeline.hosting_lifecycle', '@famtastic_pipeline.customer_portal', '@famtastic_pipeline.public_preview_deliveries', '@famtastic_pipeline.pilot_exact_dispatch_lock']

  famtastic_pipeline.campaign_messages:
    class: Drupal\famtastic_pipeline\Service\CampaignMessageService
    arguments: ['@database', '@entity_type.manager', '@famtastic_pipeline.operational_ledger', '@famtastic_pipeline.token_manager', '@famtastic_pipeline.mailer', '@datetime.time', '@config.factory', '@famtastic_pipeline.pilot_exact_dispatch_lock']

  famtastic_pipeline.site_studio_proof_client:
    class: Drupal\famtastic_pipeline\Service\SiteStudioProofClient
    arguments: ['@http_client', '@config.factory']

  famtastic_pipeline.site_studio_build_packets:
    class: Drupal\famtastic_pipeline\Service\SiteStudioBuildPacketService
    arguments: ['@database', '@entity_type.manager', '@famtastic_pipeline.operational_ledger', '@datetime.time', '@config.factory']

  famtastic_pipeline.customer_deployment:
    class: Drupal\famtastic_pipeline\Service\CustomerDeploymentService
    arguments: ['@database', '@entity_type.manager', '@famtastic_pipeline.operational_ledger', '@datetime.time']

  famtastic_pipeline.domain_lifecycle:
    class: Drupal\famtastic_pipeline\Service\DomainLifecycleService
    arguments: ['@database', '@famtastic_pipeline.operational_ledger', '@datetime.time']

  famtastic_pipeline.hosting_lifecycle:
    class: Drupal\famtastic_pipeline\Service\HostingLifecycleService
    arguments: ['@database', '@entity_type.manager', '@famtastic_pipeline.operational_ledger', '@datetime.time']

  famtastic_pipeline.analytics:
    class: Drupal\famtastic_pipeline\Service\PipelineAnalyticsService
    arguments: ['@database']

  famtastic_pipeline.google_analytics_reporting:
    class: Drupal\famtastic_pipeline\Service\GoogleAnalyticsReportingService
    arguments: ['@http_client', '@cache.default', '@logger.channel.famtastic_pipeline']

  famtastic_pipeline.build_telemetry:
    class: Drupal\famtastic_pipeline\Service\BuildTelemetryService
    arguments: ['@database', '@datetime.time']

  famtastic_pipeline.stripe_gateway:
    class: Drupal\famtastic_pipeline\Service\StripeGateway
    arguments: ['@http_client', '@logger.channel.famtastic_pipeline', '@famtastic_pipeline.proof_campaign_service']

  famtastic_pipeline.stub_gateway:
    class: Drupal\famtastic_pipeline\Service\StubGateway

  famtastic_pipeline.gateway_manager:
    class: Drupal\famtastic_pipeline\Service\PaymentGatewayManager
    arguments: ['@famtastic_pipeline.stripe_gateway', '@famtastic_pipeline.stub_gateway']

  famtastic_pipeline.webhook_verifier:
    class: Drupal\famtastic_pipeline\Service\WebhookVerifier

  famtastic_pipeline.inkbox_webhook_verifier:
    class: Drupal\famtastic_pipeline\Service\InkboxWebhookVerifier

  famtastic_pipeline.concierge_webhooks:
    class: Drupal\famtastic_pipeline\Service\ConciergeWebhookService
    arguments: ['@entity_type.manager', '@famtastic_pipeline.operational_ledger']

  famtastic_pipeline.fulfillment:
    class: Drupal\famtastic_pipeline\Service\FulfillmentService
    arguments: ['@entity_type.manager', '@datetime.time', '@logger.channel.famtastic_pipeline', '@famtastic_pipeline.proof_campaign_service', '@famtastic_pipeline.operational_ledger', '@famtastic_pipeline.customer_portal']

  famtastic_pipeline.studio_builder:
    class: Drupal\famtastic_pipeline\Service\SiteStudioRequestBuilder
    arguments: ['@config.factory']

  famtastic_pipeline.studio_adapter:
    class: Drupal\famtastic_pipeline\Service\FileExportAdapter
    arguments: ['@file_system', '@logger.channel.famtastic_pipeline']

  famtastic_pipeline.studio_generator:
    class: Drupal\famtastic_pipeline\Service\StudioRequestGenerator
    arguments: ['@famtastic_pipeline.repository', '@famtastic_pipeline.studio_builder', '@famtastic_pipeline.studio_adapter', '@entity_type.manager', '@famtastic_pipeline.operational_ledger', '@famtastic_pipeline.build_telemetry']

  famtastic_pipeline.proof_campaign_service:
    class: Drupal\famtastic_pipeline\Service\ProofCampaignService
    arguments: ['@entity_type.manager', '@config.factory', '@datetime.time', '@file_system', '@famtastic_pipeline.studio_adapter', '@famtastic_pipeline.repository', '@logger.channel.famtastic_pipeline', '@famtastic_pipeline.site_studio_proof_client', '@famtastic_pipeline.operational_ledger', '@famtastic_pipeline.build_telemetry', '@database', '@famtastic_pipeline.customer_portal', '@famtastic_pipeline.public_preview_deliveries']

  famtastic_pipeline.mailer:
    class: Drupal\famtastic_pipeline\Service\OutreachMailer
    arguments: ['@config.factory', '@logger.channel.famtastic_pipeline']

  famtastic_pipeline.attribution:
    class: Drupal\famtastic_pipeline\Service\AttributionService
    arguments: ['@database', '@datetime.time']

  famtastic_pipeline.microsites:
    class: Drupal\famtastic_pipeline\Service\MicrositeService
    arguments: ['@database', '@datetime.time']

  famtastic_pipeline.booking_requests:
    class: Drupal\famtastic_pipeline\Service\BookingRequestService
    arguments: ['@database', '@datetime.time', '@uuid']

  famtastic_pipeline.booking_availability:
    class: Drupal\famtastic_pipeline\Service\BookingAvailabilityService
    arguments: ['@database', '@datetime.time', '@uuid']

  famtastic_pipeline.booking_site_owners:
    class: Drupal\famtastic_pipeline\Service\BookingSiteOwnerService
    arguments: ['@database', '@datetime.time']

  famtastic_pipeline.customer_portal:
    class: Drupal\famtastic_pipeline\Service\CustomerPortalService
    arguments: ['@database', '@entity_type.manager', '@datetime.time', '@uuid', '@config.factory', '@famtastic_pipeline.operational_ledger', '@famtastic_pipeline.attribution', '@famtastic_pipeline.public_preview_deliveries', '@?famtastic_pipeline.webform_bridge']

  famtastic_pipeline.deep_dive_invitations:
    class: Drupal\famtastic_pipeline\Service\DeepDiveInvitationService
    arguments: ['@database', '@entity_type.manager', '@datetime.time', '@uuid']

  famtastic_pipeline.public_preview_deliveries:
    class: Drupal\famtastic_pipeline\Service\PublicPreviewDeliveryService
    arguments: ['@database', '@entity_type.manager', '@datetime.time', '@uuid', '@config.factory', '@famtastic_pipeline.operational_ledger', '@famtastic_pipeline.mailer', '@famtastic_pipeline.proof_cohort_profiles', '@famtastic_pipeline.cold_proof_commercial_messages', '@famtastic_pipeline.verified_cold_outreach_gate', '@famtastic_pipeline.public_preview_content_guard']

  famtastic_pipeline.grant_codes:
    class: Drupal\famtastic_pipeline\Service\GrantCodeService
    arguments: ['@database', '@datetime.time', '@uuid']

  famtastic_pipeline.commerce_lifecycle:
    class: Drupal\famtastic_pipeline\Service\CommerceLifecycleService
    arguments: ['@database', '@entity_type.manager', '@datetime.time', '@uuid', '@famtastic_pipeline.customer_portal', '@config.factory', '@famtastic_pipeline.operational_ledger']

  famtastic_pipeline.lifecycle_operations:
    class: Drupal\famtastic_pipeline\Service\LifecycleOperationsService
    arguments: ['@database', '@datetime.time', '@famtastic_pipeline.mailer', '@config.factory', '@file_system', '@famtastic_pipeline.automation_worker', '@famtastic_pipeline.support_drafts', '@famtastic_pipeline.pilot_exact_dispatch_lock']

  famtastic_pipeline.support_intent_classifier:
    class: Drupal\famtastic_pipeline\Service\SupportIntentClassifier

  famtastic_pipeline.support_sla:
    class: Drupal\famtastic_pipeline\Service\SupportSlaService
    arguments: ['@database', '@datetime.time', '@config.factory']

  famtastic_pipeline.support_drafts:
    class: Drupal\famtastic_pipeline\Service\SupportDraftService
    arguments: ['@database', '@datetime.time', '@famtastic_pipeline.support_intent_classifier', '@famtastic_pipeline.support_sla']

  famtastic_pipeline.postiz_channels:
    class: Drupal\famtastic_pipeline\Service\PostizChannelsService
    arguments: ['@http_client', '@datetime.time']

  famtastic_pipeline.postiz_drop_mutation:
    class: Drupal\famtastic_pipeline\Service\PostizDropMutationService
    arguments: ['@http_client', '@logger.factory', '@current_user']

  famtastic_pipeline.front_page_redirect:
    class: Drupal\famtastic_pipeline\EventSubscriber\FrontPageRedirectSubscriber
    tags:
      - { name: event_subscriber }

  famtastic_pipeline.checkout_complete_redirect:
    class: Drupal\famtastic_pipeline\EventSubscriber\CheckoutCompleteRedirectSubscriber
    tags:
      - { name: event_subscriber }

  famtastic_pipeline.ai_solution_advisor:
    class: Drupal\famtastic_pipeline\Service\AiSolutionAdvisorService
    arguments: ['@database', '@logger.factory', '@?ai.provider']

  famtastic_pipeline.webform_bridge:
    class: Drupal\famtastic_pipeline\Service\WebformIntakeBridgeService
    arguments: ['@entity_type.manager', '@logger.factory']
