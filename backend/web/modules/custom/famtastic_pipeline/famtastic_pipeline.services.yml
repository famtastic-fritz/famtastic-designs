services:
  logger.channel.famtastic_pipeline:
    parent: logger.channel_base
    arguments: ['famtastic_pipeline']

  famtastic_pipeline.token_manager:
    class: Drupal\famtastic_pipeline\Service\TokenManager
    arguments: ['@config.factory', '@datetime.time']

  famtastic_pipeline.repository:
    class: Drupal\famtastic_pipeline\Service\PipelineRepository
    arguments: ['@entity_type.manager', '@famtastic_pipeline.token_manager', '@datetime.time']

  famtastic_pipeline.operational_ledger:
    class: Drupal\famtastic_pipeline\Service\OperationalLedger
    arguments: ['@database', '@datetime.time']

  famtastic_pipeline.lead_ingestion:
    class: Drupal\famtastic_pipeline\Service\LeadIngestionService
    arguments: ['@database', '@entity_type.manager', '@famtastic_pipeline.operational_ledger', '@datetime.time']

  famtastic_pipeline.automation_worker:
    class: Drupal\famtastic_pipeline\Service\AutomationWorker
    arguments: ['@famtastic_pipeline.operational_ledger', '@entity_type.manager', '@famtastic_pipeline.proof_campaign_service', '@famtastic_pipeline.campaign_messages', '@famtastic_pipeline.customer_deployment', '@famtastic_pipeline.domain_lifecycle', '@famtastic_pipeline.hosting_lifecycle']

  famtastic_pipeline.campaign_messages:
    class: Drupal\famtastic_pipeline\Service\CampaignMessageService
    arguments: ['@database', '@entity_type.manager', '@famtastic_pipeline.operational_ledger', '@famtastic_pipeline.token_manager', '@famtastic_pipeline.mailer', '@datetime.time']

  famtastic_pipeline.site_studio_proof_client:
    class: Drupal\famtastic_pipeline\Service\SiteStudioProofClient
    arguments: ['@http_client', '@config.factory']

  famtastic_pipeline.customer_deployment:
    class: Drupal\famtastic_pipeline\Service\CustomerDeploymentService
    arguments: ['@database', '@entity_type.manager', '@famtastic_pipeline.operational_ledger', '@datetime.time']

  famtastic_pipeline.domain_lifecycle:
    class: Drupal\famtastic_pipeline\Service\DomainLifecycleService
    arguments: ['@database', '@famtastic_pipeline.operational_ledger', '@datetime.time']

  famtastic_pipeline.hosting_lifecycle:
    class: Drupal\famtastic_pipeline\Service\HostingLifecycleService
    arguments: ['@database', '@entity_type.manager', '@famtastic_pipeline.operational_ledger', '@datetime.time']

  famtastic_pipeline.analytics:
    class: Drupal\famtastic_pipeline\Service\PipelineAnalyticsService
    arguments: ['@database']

  famtastic_pipeline.google_analytics_reporting:
    class: Drupal\famtastic_pipeline\Service\GoogleAnalyticsReportingService
    arguments: ['@http_client', '@cache.default', '@logger.channel.famtastic_pipeline']

  famtastic_pipeline.build_telemetry:
    class: Drupal\famtastic_pipeline\Service\BuildTelemetryService
    arguments: ['@database', '@datetime.time']

  famtastic_pipeline.stripe_gateway:
    class: Drupal\famtastic_pipeline\Service\StripeGateway
    arguments: ['@http_client', '@logger.channel.famtastic_pipeline', '@famtastic_pipeline.proof_campaign_service']

  famtastic_pipeline.stub_gateway:
    class: Drupal\famtastic_pipeline\Service\StubGateway

  famtastic_pipeline.gateway_manager:
    class: Drupal\famtastic_pipeline\Service\PaymentGatewayManager
    arguments: ['@famtastic_pipeline.stripe_gateway', '@famtastic_pipeline.stub_gateway']

  famtastic_pipeline.webhook_verifier:
    class: Drupal\famtastic_pipeline\Service\WebhookVerifier

  famtastic_pipeline.fulfillment:
    class: Drupal\famtastic_pipeline\Service\FulfillmentService
    arguments: ['@entity_type.manager', '@datetime.time', '@logger.channel.famtastic_pipeline', '@famtastic_pipeline.proof_campaign_service', '@famtastic_pipeline.operational_ledger', '@famtastic_pipeline.customer_portal']

  famtastic_pipeline.studio_builder:
    class: Drupal\famtastic_pipeline\Service\SiteStudioRequestBuilder
    arguments: ['@config.factory']

  famtastic_pipeline.studio_adapter:
    class: Drupal\famtastic_pipeline\Service\FileExportAdapter
    arguments: ['@file_system', '@logger.channel.famtastic_pipeline']

  famtastic_pipeline.studio_generator:
    class: Drupal\famtastic_pipeline\Service\StudioRequestGenerator
    arguments: ['@famtastic_pipeline.repository', '@famtastic_pipeline.studio_builder', '@famtastic_pipeline.studio_adapter', '@entity_type.manager', '@famtastic_pipeline.operational_ledger', '@famtastic_pipeline.build_telemetry']

  famtastic_pipeline.proof_campaign_service:
    class: Drupal\famtastic_pipeline\Service\ProofCampaignService
    arguments: ['@entity_type.manager', '@config.factory', '@datetime.time', '@file_system', '@famtastic_pipeline.studio_adapter', '@famtastic_pipeline.repository', '@logger.channel.famtastic_pipeline', '@famtastic_pipeline.site_studio_proof_client', '@famtastic_pipeline.operational_ledger', '@famtastic_pipeline.build_telemetry']

  famtastic_pipeline.mailer:
    class: Drupal\famtastic_pipeline\Service\OutreachMailer
    arguments: ['@config.factory', '@logger.channel.famtastic_pipeline']

  famtastic_pipeline.customer_portal:
    class: Drupal\famtastic_pipeline\Service\CustomerPortalService
    arguments: ['@database', '@entity_type.manager', '@datetime.time', '@uuid', '@config.factory']

  famtastic_pipeline.commerce_lifecycle:
    class: Drupal\famtastic_pipeline\Service\CommerceLifecycleService
    arguments: ['@database', '@entity_type.manager', '@datetime.time', '@uuid', '@famtastic_pipeline.customer_portal', '@config.factory']

  famtastic_pipeline.lifecycle_operations:
    class: Drupal\famtastic_pipeline\Service\LifecycleOperationsService
    arguments: ['@database', '@datetime.time', '@famtastic_pipeline.mailer', '@config.factory', '@file_system']
