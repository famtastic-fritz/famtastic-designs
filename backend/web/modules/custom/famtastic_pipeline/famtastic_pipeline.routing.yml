# --- Public, token-scoped prospect API (anonymous; access is by link token) ---
famtastic_pipeline.public_quote:
  path: '/api/public/quote'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\PublicRequestController::quote'
  methods: [POST]
  requirements:
    _access: 'TRUE'

famtastic_pipeline.public_contact:
  path: '/api/public/contact'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\PublicRequestController::contact'
  methods: [POST]
  requirements:
    _access: 'TRUE'

famtastic_pipeline.email_open:
  path: '/api/pipeline/email/open/{tracking_key}'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\EmailEventController::open'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    tracking_key: '[a-f0-9]{48}'

famtastic_pipeline.email_click:
  path: '/api/pipeline/email/click/{tracking_key}'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\EmailEventController::click'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    tracking_key: '[a-f0-9]{48}'

famtastic_pipeline.email_unsubscribe:
  path: '/api/pipeline/email/unsubscribe/{unsubscribe_key}'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\EmailEventController::unsubscribe'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    unsubscribe_key: '[a-f0-9]{48}'

famtastic_pipeline.email_provider:
  path: '/api/pipeline/email/provider-event'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\EmailEventController::provider'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

famtastic_pipeline.site_studio_callback:
  path: '/api/pipeline/site-studio/callback'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\SiteStudioCallbackController::handle'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

famtastic_pipeline.session:
  path: '/api/pipeline/session'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\PipelineController::session'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

famtastic_pipeline.confirm:
  path: '/api/pipeline/confirm'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\PipelineController::confirm'
  methods: [POST]
  requirements:
    _access: 'TRUE'

famtastic_pipeline.checkout:
  path: '/api/pipeline/checkout'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\PipelineController::checkout'
  methods: [POST]
  requirements:
    _access: 'TRUE'

famtastic_pipeline.revision_checkout:
  path: '/api/pipeline/revision-checkout'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\PipelineController::revisionCheckout'
  methods: [POST]
  requirements:
    _access: 'TRUE'

famtastic_pipeline.hosting_renewal:
  path: '/api/pipeline/hosting-renewal'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\PipelineController::hostingRenewal'
  methods: [POST]
  requirements:
    _access: 'TRUE'

famtastic_pipeline.order_status:
  path: '/api/pipeline/order-status'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\PipelineController::orderStatus'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

famtastic_pipeline.intake:
  path: '/api/pipeline/intake'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\PipelineController::intake'
  methods: [POST]
  requirements:
    _access: 'TRUE'

famtastic_pipeline.asset:
  path: '/api/pipeline/asset'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\PipelineController::asset'
  methods: [POST]
  requirements:
    _access: 'TRUE'

famtastic_pipeline.approval:
  path: '/api/pipeline/approval'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\PipelineController::approval'
  methods: [POST]
  requirements:
    _access: 'TRUE'

# --- Proof campaign API (anonymous; access is by link token) ---
famtastic_pipeline.proof_campaign_create:
  path: '/api/pipeline/proof-campaign'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\ProofCampaignController::createCampaign'
  methods: [POST]
  requirements:
    _access: 'TRUE'

famtastic_pipeline.proof_campaign_show:
  path: '/api/pipeline/proof-campaign'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\ProofCampaignController::show'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

famtastic_pipeline.proof_campaign_select:
  path: '/api/pipeline/proof-campaign/select'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\ProofCampaignController::selectAction'
  methods: [POST]
  requirements:
    _access: 'TRUE'

# --- Stripe webhook (signature-verified inside the controller) ---
famtastic_pipeline.stripe_webhook:
  path: '/api/pipeline/stripe/webhook'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\StripeWebhookController::handle'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

# --- Stub-mode-only payment simulation (refuses to run with a real Stripe key) ---
famtastic_pipeline.stripe_simulate:
  path: '/api/pipeline/stripe/simulate'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\SimulateController::handle'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

# --- Admin: generate & export the Site Studio request ---
famtastic_pipeline.operations:
  path: '/admin/famtastic'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\OperationsController::dashboard'
    _title: 'FAMtastic Operations'
  requirements:
    _permission: 'administer famtastic pipeline'

famtastic_pipeline.operations_campaign:
  path: '/admin/famtastic/campaign/{campaign_key}'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\OperationsController::campaign'
    _title: 'Campaign'
  requirements:
    _permission: 'administer famtastic pipeline'
    campaign_key: '[a-zA-Z0-9._-]+'

famtastic_pipeline.operations_message:
  path: '/admin/famtastic/message/{message}'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\OperationsController::message'
    _title: 'Email Message'
  requirements:
    _permission: 'administer famtastic pipeline'
    message: '\d+'

famtastic_pipeline.operations_build:
  path: '/admin/famtastic/build/{build_run}'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\OperationsController::build'
    _title: 'Build Run'
  requirements:
    _permission: 'administer famtastic pipeline'
    build_run: '\d+'

famtastic_pipeline.studio_generate:
  path: '/admin/famtastic/prospect/{famtastic_prospect}/generate-studio'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\StudioController::generate'
  requirements:
    _permission: 'administer famtastic pipeline'
  options:
    parameters:
      famtastic_prospect:
        type: 'entity:famtastic_prospect'

famtastic_pipeline.studio_export_json:
  path: '/admin/famtastic/project/{famtastic_project}/export.json'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\StudioController::exportJson'
  requirements:
    _permission: 'administer famtastic pipeline'
  options:
    parameters:
      famtastic_project:
        type: 'entity:famtastic_project'

famtastic_pipeline.studio_export_brief:
  path: '/admin/famtastic/project/{famtastic_project}/export.md'
  defaults:
    _controller: 'Drupal\famtastic_pipeline\Controller\StudioController::exportBrief'
  requirements:
    _permission: 'administer famtastic pipeline'
  options:
    parameters:
      famtastic_project:
        type: 'entity:famtastic_project'
