    region: content
    settings: &id001
      size: 60
      placeholder: ''
    third_party_settings: {}
  field_hero_subheadline:
    type: string_textfield
    weight: 4
    region: content
    settings: *id001
    third_party_settings: {}
  field_cta_text:
    type: string_textfield
    weight: 5
    region: content
    settings: *id001
    third_party_settings: {}
