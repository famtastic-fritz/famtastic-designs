; FAMtastic Designs — PHP-FPM pool for the Drupal 11 backend container.
;
; Replaces the stock pool (the Dockerfile deletes www.conf/zz-docker.conf):
; listens on a unix socket shared with the colocated nginx, runs as www-data,
; and passes container environment variables (DB_*, PLATFORM_*) through.

[global]
pid = /run/php-fpm/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
user = www-data
group = www-data

listen = /run/php-fpm/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; docker-compose injects DB_HOST/DB_NAME/DB_USER/DB_PASSWORD; Platform.sh
; injects PLATFORM_RELATIONSHIPS. settings.php reads both via getenv().
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 32M
