<!doctype html>
<html lang="en" style="background-color: #0a0a0a;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FAMtastic Designs is an agentic AI business solutions engineering studio. We build custom websites, intelligent applications, AI-powered systems, and digital experiences that grow businesses worldwide." />
    <meta name="keywords" content="custom website design, AI solutions, business applications, web development, digital transformation, agentic AI" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://famtasticdesigns.com/" />
    <meta property="og:site_name" content="FAMtastic Designs" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FAMtastic Designs | Agentic AI Business Solutions Engineering Studio" />
    <meta property="og:description" content="We engineer intelligent systems that capture leads, automate operations, and grow businesses — worldwide. Custom websites, AI applications, and digital solutions." />
    <meta property="og:url" content="https://famtasticdesigns.com/" />
    <meta property="og:image" content="https://famtasticdesigns.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FAMtastic Designs | Agentic AI Business Solutions Engineering Studio" />
    <meta name="twitter:description" content="We engineer intelligent systems that capture leads, automate operations, and grow businesses — worldwide." />
    <meta name="twitter:image" content="https://famtasticdesigns.com/og-image.jpg" />
    <title>FAMtastic Designs | Agentic AI Business Solutions Engineering Studio</title>
    <!--
      Organization + local-search markup. Static so every crawler sees it on
      first byte, without waiting for the SPA bundle.
      TODO (owner): add telephone, streetAddress, postalCode, and openingHours
      once confirmed — deliberately omitted rather than guessed.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "FAMtastic Designs",
        "url": "https://famtasticdesigns.com",
        "image": "https://famtasticdesigns.com/og-image.jpg",
        "description": "Custom websites, intelligent applications, and AI-powered systems for small businesses. Website builds start at $199.",
        "email": "hello@famtasticdesigns.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Port St. Lucie",
          "addressRegion": "FL",
          "addressCountry": "US"
        },
        "areaServed": [
          { "@type": "City", "name": "Port St. Lucie" },
          { "@type": "Country", "name": "United States" }
        ],
        "priceRange": "$$",
        "makesOffer": {
          "@type": "Offer",
          "name": "FAMtastic Basic Website",
          "price": "199.00",
          "priceCurrency": "USD",
          "url": "https://famtasticdesigns.com/199/"
        }
      }
    </script>
    <!-- v1 type system: Space Grotesk (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Pre-hydration paint: avoid any white flash before the bundle loads. */
      html,
      body {
        margin: 0;
        background-color: #0a0a0a;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
