# FAMtastic Designs — SPA + API proxy (Phase 2 deployment scaffold).
#
# Serves the Vite production bundle with history-mode fallback and proxies
# JSON:API + OAuth endpoints to the Drupal backend container. Inside
# docker-compose the backend is reachable as `backend:80` (service name).
# The SPA is built with an empty VITE_DRUPAL_BASE_URL, so src/api/drupal.js
# calls /jsonapi and /oauth on this same origin and no CORS is involved.

upstream famtastic_backend {
    server backend:80;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Drupal JSON:API ─────────────────────────────────────────────────
    location /jsonapi {
        proxy_pass http://famtastic_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── OAuth2 token endpoint (drupal/simple_oauth) ─────────────────────
    location /oauth {
        proxy_pass http://famtastic_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Content-hashed build assets: long-lived immutable cache ─────────
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback: client-side routes resolve to index.html ──────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
